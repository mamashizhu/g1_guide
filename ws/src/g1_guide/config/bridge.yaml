# ros_gz_bridge applies frame_id per GZ_TO_ROS bridge entry. The generated URDF
# also declares d435_optical_frame as the sensor optical frame and the fixed TF
# d435_link -> d435_optical_frame. The generated lidar and IMU declare their
# Gazebo frame IDs and have fixed URDF transforms from the torso; no
# machine-specific path is embedded here.
