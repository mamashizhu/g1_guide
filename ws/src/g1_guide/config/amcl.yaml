# AMCL 定位参数（M2.2 SLAM 地图导航）。输入：map_server 发布的 SLAM 地图 + /nav_scan + odom TF。
# 输出：map -> odom 修正，抵消里程计漂移。initial_pose 由 slam_nav.launch.py 按场景出生点填入。
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /nav_scan
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # 里程计噪声（旋转→旋转、平移→旋转、平移→平移、旋转→平移）
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_min_range: 0.5
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_d: 0.1
    update_min_a: 0.1
    transform_tolerance: 1.0
    tf_broadcast: true
    save_pose_rate: 0.5
    set_initial_pose: true
    first_map_only: false
