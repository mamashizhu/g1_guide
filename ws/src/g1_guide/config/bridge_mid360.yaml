# 真机雷达版额外桥接：MID-360 3D 点云（gz 3D 雷达把点云发在 <topic>/points）。
# 由 slam.launch.py lidar:=mid360 加载，与 bridge.yaml 同时使用。
- ros_topic_name: /mid360/points
  gz_topic_name: /mid360/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  frame_id: mid360_link
# 真机雷达版的 Gazebo 真值位姿（不发 TF）；odom_drift 由它生成 /odom 和 odom->base_link。
- ros_topic_name: /odom_truth
  gz_topic_name: /odom_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
